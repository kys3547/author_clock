<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal StandBy Dashboard</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StandBy">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180' width='180' height='180'><rect width='180' height='180' rx='40' fill='%23121316'/><path d='M45 55C45 46.7157 51.7157 40 60 40H90V140H60C51.7157 140 45 133.284 45 125V55Z' fill='%231e212a'/><path d='M135 55C135 46.7157 128.284 40 120 40H90V140H120C128.284 140 135 133.284 135 125V55Z' fill='%23252936'/><path d='M55 135C70 135 85 138 90 142C95 138 110 135 125 135' stroke='%234a5164' stroke-width='4' fill='none' stroke-linecap='round'/><circle cx='90' cy='85' r='30' fill='%23121316' stroke='%23d1d5db' stroke-width='3'/><path d='M90 63V85L104 94' stroke='%23e3e3e6' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><circle cx='90' cy='85' r='2' fill='%23ffffff'/></svg>">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #0b0b0c; color: #e3e3e6; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; height: 100vh; display: -webkit-flex; display: flex; -webkit-flex-direction: row; flex-direction: row; }
        
        .panel { width: 50%; height: 100vh; padding: 60px 50px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; position: relative; }
        .left-panel { border-right: 1px solid #222; background-color: #0b0b0c; -webkit-align-items: flex-start; align-items: flex-start; }
        .right-panel { background-color: #050505; -webkit-align-items: center; align-items: center; }
        
        .date-display { position: absolute; top: 40px; left: 50px; font-size: 1.1rem; color: #666; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        .quote-text, .quote-author { -webkit-transition: opacity 0.5s ease-in-out, font-size 0.3s ease, line-height 0.3s ease; transition: opacity 0.5s ease-in-out, font-size 0.3s ease, line-height 0.3s ease; opacity: 1; }
        .quote-text { font-family: 'Georgia', serif; font-weight: 300; text-align: left; word-break: normal; word-wrap: break-word; }
        .right-panel .quote-text { text-align: center; } 
        
        strong { font-weight: 700; color: #ffffff; }
        .quote-author { font-size: 1.2rem; color: #888; font-family: 'Georgia', serif; margin-top: 10px; -webkit-transition: margin-top 0.3s ease; transition: margin-top 0.3s ease; }
        .quote-author em { font-style: italic; color: #aaa; } 
        .right-panel .quote-author { text-align: center; width: 100%; }

        .weather-info { display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; gap: 14px; margin-bottom: 35px; -webkit-transition: margin-bottom 0.3s ease; transition: margin-bottom 0.3s ease; }
        #weatherIcon { font-size: 3.5rem; line-height: 1; }
        .weather-info span.temp { font-size: 2.5rem; color: #aaa; font-weight: 200; line-height: 1; }
        .weather-info span.city { font-size: 1.1rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; line-height: 1; margin-bottom: 3px; }

        .nobrk-ellipsis { white-space: nowrap; display: inline-block; color: #666; }
        .screensaver { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; cursor: pointer; }

        @media (orientation: portrait) {
            body { -webkit-flex-direction: column; flex-direction: column; } 
            .panel { width: 100%; height: 50vh; padding: 40px 40px; }
            .left-panel { border-right: none; border-bottom: 1px solid #222; -webkit-justify-content: flex-end; justify-content: flex-end; padding-bottom: 40px; }
            .right-panel { -webkit-justify-content: flex-start; justify-content: flex-start; padding-top: 40px; }
            .date-display { top: 30px; left: 40px; font-size: 1rem; }
            .weather-info { margin-bottom: 20px; gap: 12px; }
            #weatherIcon { font-size: 3rem; }
            .weather-info span.temp { font-size: 2.2rem; }
            .weather-info span.city { font-size: 0.95rem; }
            .quote-author { font-size: 1.1rem; margin-top: 8px; }
        }
    </style>
</head>
<body>

    <div class="panel left-panel" id="weatherPanel">
        <div class="date-display" id="currentDate">-- --- ----</div>
        <div class="weather-info">
            <span id="weatherIcon">--</span>
            <span class="temp" id="weatherTemp">--°C</span>
            <span class="city" id="cityLabel">DETECTING...</span>
        </div>
        <div class="quote-text" id="weatherQuote">Loading real-time weather...</div>
        <div class="quote-author" id="weatherAuthor"></div>
    </div>

    <div class="panel right-panel" id="clockPanel">
        <div class="quote-text" id="clockQuote">Syncing time with literature...</div>
        <div class="quote-author" id="clockAuthor"></div>
    </div>

    <div class="screensaver" id="screensaverOverlay" onclick="wakeUp()"></div>

    <script>
        var idleTimer;
        var lastTimeStr = ""; 
        var idleLimit = 5 * 60 * 1000;

        var weatherDatabase = {
            "Clear": [
                { q: "Even for me life had its gleams of <strong>sunshine</strong>.", a: "<em>Jane Eyre</em>, Charlotte Brontë", icon: "☀️" },
                { q: "Some people seemed to get all <strong>sunshine</strong>, and some all shadow.", a: "<em>Little Women</em>, Louisa May Alcott", icon: "☀️" }
            ],
            "PartlyCloudy": [
                { q: "A <strong>few clouds</strong> floated in a sky otherwise perfectly blue.", a: "<em>The Awakening</em>, Kate Chopin", icon: "🌤️" },
                { q: "The sky was blue, with a <strong>few light clouds</strong> like feathers.", a: "<em>Sons and Lovers</em>, D.H. Lawrence", icon: "🌤️" }
            ],
            "MostlyCloudy": [
                { q: "The sky was <strong>heavy with clouds</strong>, moving rapidly across the moon.", a: "<em>Dracula</em>, Bram Stoker", icon: "⛅" },
                { q: "The sky was <strong>mostly overcast with clouds</strong>, though now and then a shaft of light broke through.", a: "<em>The Return of the Native</em>, Thomas Hardy", icon: "⛅" }
            ],
            "Overcast": [
                { q: "In every <strong>cloud</strong>, in every tree—filling the air at night... I am surrounded with her image!", a: "<em>Wuthering Heights</em>, Emily Brontë", icon: "☁️" },
                { q: "I wandered lonely as a <strong>cloud</strong> that floats on high o'er vales and hills.", a: "<em>I Wandered Lonely as a Cloud</em>, William Wordsworth", icon: "☁️" }
            ],
            "Rain": [
                { q: "The <strong>rain</strong> continued to fall steadily.", a: "<em>A Farewell to Arms</em>, Ernest Hemingway", icon: "🌧️" },
                { q: "The <strong>rain</strong> pattered dismally against the panes.", a: "<em>Frankenstein</em>, Mary Shelley", icon: "🌧️" }
            ],
            "Snow": [
                { q: "A <strong>snowball</strong> in the face is surely the perfect beginning to a lasting friendship.", a: "<em>The Book Thief</em>, Markus Zusak", icon: "❄️" },
                { q: "In the falling quiet there was no sky or earth, only <strong>snow</strong> lifting in the wind...", a: "<em>Miriam</em>, Truman Capote", icon: "❄️" }
            ],
            "Shower": [
                { q: "A sudden <strong>shower</strong> came on, and they were all soaked through.", a: "<em>The Wind in the Willows</em>, Kenneth Grahame", icon: "🌦️" }
            ],
            "Drizzle": [
                { q: "A fine, cold <strong>drizzle</strong> was falling, blurring the outlines of the houses.", a: "<em>The Picture of Dorian Gray</em>, Oscar Wilde", icon: "🌫️" }
            ],
            "Sleet": [
                { q: "The wind blew cold, and a driving <strong>sleet</strong> began to fall, freezing as it touched the ground.", a: "<em>The Call of the Wild</em>, Jack London", icon: "🌨️" }
            ],
            "Hail": [
                { q: "The <strong>hail</strong> rattled on the roof, making such a noise that they could hardly hear each other speak.", a: "<em>The Secret Garden</em>, Frances Hodgson Burnett", icon: "☄️" }
            ],
            "HeavyRain": [
                { q: "The <strong>torrential rain</strong> fell in a solid wall, erasing the line between earth and sky.", a: "<em>One Hundred Years of Solitude</em>, Gabriel García Márquez", icon: "🌊" }
            ],
            "HeavySnow": [
                { q: "The day she was buried there came a fall of <strong>snow</strong>; it blew bleak as snow.", a: "<em>Wuthering Heights</em>, Emily Brontë", icon: "☃️" }
            ],
            "StrongWind": [
                { q: "The <strong>wind was howling</strong> through the trees, shaking the very foundations of the house.", a: "<em>Dracula</em>, Bram Stoker", icon: "💨" }
            ],
            "RoughSeas": [
                { q: "The <strong>sea ran mountains high</strong>, and we expected every moment to be swallowed up by the waves.", a: "<em>Robinson Crusoe</em>, Daniel Defoe", icon: "⚓" }
            ],
            "Dry": [
                { q: "The land was <strong>parched and dry</strong>, the grass turned to a dusty brown under the pitiless sun.", a: "<em>The Grapes of Wrath</em>, John Steinbeck", icon: "🏜️" }
            ],
            "Typhoon": [
                { q: "The fury of the <strong>typhoon</strong> was like the wrath of an angry god, lashed by wind and water.", a: "<em>Typhoon</em>, Joseph Conrad", icon: "🌀" }
            ],
            "Heatwave": [
                { q: "It was a <strong>blazing hot day</strong> in August, and the city felt like an oven.", a: "<em>The Bell Jar</em>, Sylvia Plath", icon: "🥵" }
            ],
            "ColdWave": [
                { q: "The <strong>bitter cold</strong> penetrated through their thickest garments, freezing their breath into ice.", a: "<em>The Call of the Wild</em>, Jack London", icon: "🥶" }
            ]
        };

        function init() {
            resetIdleTimer();
            setupEventListeners();
            updateDate();
            fetchWeather();
            checkTimeEngine();
            setInterval(checkTimeEngine, 1000);
            setInterval(fetchWeather, 30 * 60000);
        }

        function safeTransitionUpdate(textId, authorId, textHtml, authorHtml) {
            var txtEl = document.getElementById(textId);
            var autEl = document.getElementById(authorId);
            
            txtEl.style.opacity = 0;
            if(autEl) autEl.style.opacity = 0;
            
            setTimeout(function() {
                txtEl.innerHTML = textHtml;
                if(autEl) autEl.innerHTML = authorHtml;
                
                var rawTextLength = txtEl.innerText.length;
                var isPortrait = window.matchMedia("(orientation: portrait)").matches;
                
                if (isPortrait) {
                    if (rawTextLength > 100) {
                        txtEl.style.fontSize = "1.25rem";
                        txtEl.style.lineHeight = "1.4";
                    } else if (rawTextLength > 50) {
                        txtEl.style.fontSize = "1.45rem";
                        txtEl.style.lineHeight = "1.4";
                    } else {
                        txtEl.style.fontSize = "1.75rem";
                        txtEl.style.lineHeight = "1.5";
                    }
                } else {
                    if (rawTextLength > 120) {
                        txtEl.style.fontSize = "1.7rem";
                        txtEl.style.lineHeight = "1.5";
                    } else if (rawTextLength > 75) {
                        txtEl.style.fontSize = "2.0rem";
                        txtEl.style.lineHeight = "1.5";
                    } else {
                        txtEl.style.fontSize = "2.35rem";
                        txtEl.style.lineHeight = "1.6";
                    }
                }
                
                if (textId === 'weatherQuote') {
                    var weatherInfoEl = document.querySelector('.weather-info');
                    if (isPortrait) {
                        if (rawTextLength > 80) {
                            weatherInfoEl.style.marginBottom = "12px";
                            if(autEl) autEl.style.marginTop = "6px";
                        } else {
                            weatherInfoEl.style.marginBottom = "22px";
                            if(autEl) autEl.style.marginTop = "10px";
                        }
                    } else {
                        if (rawTextLength > 100) {
                            weatherInfoEl.style.marginBottom = "20px";
                            if(autEl) autEl.style.marginTop = "8px";
                        } else {
                            weatherInfoEl.style.marginBottom = "38px";
                            if(autEl) autEl.style.marginTop = "14px";
                        }
                    }
                }
                
                txtEl.style.opacity = 1;
                if(autEl) autEl.style.opacity = 1;
            }, 500);
        }

        function updateDate() {
            var now = new Date();
            var day = String(now.getDate());
            if(day.length < 2) day = '0' + day;
            var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            document.getElementById('currentDate').innerText = day + " " + months[now.getMonth()] + " " + now.getFullYear();
        }

        function fetchWeather() {
            var lat = 37.5665; 
            var lon = 126.9780; 
            var cityName = "Seoul";

            var locXhr = new XMLHttpRequest();
            locXhr.open("GET", "https://ipapi.co/json/", true);
            locXhr.onreadystatechange = function() {
                if (locXhr.readyState === 4) {
                    if (locXhr.status === 200) {
                        try {
                            var locData = JSON.parse(locXhr.responseText);
                            lat = locData.latitude || lat; 
                            lon = locData.longitude || lon; 
                            cityName = locData.city || cityName;
                        } catch(e) {}
                    }
                    getWeatherData(lat, lon, cityName);
                }
            };
            locXhr.send();
        }

        function getWeatherData(lat, lon, cityName) {
            var xhr = new XMLHttpRequest();
            var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m";
            
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            var temp = Math.round(data.current.temperature_2m);
                            var code = data.current.weather_code;
                            var wind = data.current.wind_speed_10m;
                            var humidity = data.current.relative_humidity_2m;
                            
                            var condition = "Clear";
                            
                            if (temp >= 33) condition = "Heatwave";
                            else if (temp <= -10) condition = "ColdWave";
                            else if (wind >= 50 && (code === 95 || code === 96 || code === 99)) condition = "Typhoon";
                            else if (wind >= 50) condition = "RoughSeas";
                            else if (wind >= 39) condition = "StrongWind";
                            else if (humidity <= 30 && code <= 3) condition = "Dry";
                            else {
                                if (code === 0) condition = "Clear";
                                else if (code === 1) condition = "PartlyCloudy";
                                else if (code === 2) condition = "MostlyCloudy";
                                else if (code === 3 || code === 45 || code === 48) condition = "Overcast";
                                else if (code === 51 || code === 53 || code === 55) condition = "Drizzle";
                                else if (code === 61 || code === 63) condition = "Rain";
                                else if (code === 65) condition = "HeavyRain";
                                else if (code === 66 || code === 67 || code === 77) condition = "Sleet";
                                else if (code === 71 || code === 73) condition = "Snow";
                                else if (code === 75) condition = "HeavySnow";
                                else if (code === 80 || code === 81) condition = "Shower";
                                else if (code === 82 || code === 85 || code === 86 || code === 95) condition = "HeavyRain"; 
                                else if (code === 96 || code === 99) condition = "Hail";
                            }

                            var quotesList = weatherDatabase[condition];
                            var match = quotesList[Math.floor(Math.random() * quotesList.length)];

                            document.getElementById('weatherIcon').innerText = match.icon;
                            document.getElementById('weatherTemp').innerText = temp + "°C";
                            document.getElementById('cityLabel').innerText = cityName.toUpperCase();
                            
                            safeTransitionUpdate('weatherQuote', 'weatherAuthor', match.q, "- " + match.a);
                        } catch (e) {
                            showOfflineWeather();
                        }
                    } else {
                        showOfflineWeather();
                    }
                }
            };
            xhr.send();
        }

        function showOfflineWeather() {
            safeTransitionUpdate('weatherQuote', 'weatherAuthor', 
                "The connection to the world was severed; the sky remained an <strong>unreadable page</strong>.", 
                "- The Offline Chronicler"
            );
            document.getElementById('weatherIcon').innerText = "🌐";
            document.getElementById('weatherTemp').innerText = "Offline";
            document.getElementById('cityLabel').innerText = "DISCONNECTED";
        }

        function checkTimeEngine() {
            var now = new Date();
            var hours = String(now.getHours());
            if(hours.length < 2) hours = '0' + hours;
            var minutes = String(now.getMinutes());
            if(minutes.length < 2) minutes = '0' + minutes;
            var currentTimeStr = hours + ":" + minutes;

            if (currentTimeStr !== lastTimeStr) {
                lastTimeStr = currentTimeStr;
                updateClock(hours, minutes);
                updateDate();
            }
        }

        function updateClock(hours, minutes) {
            var fileTimeStr = hours + "_" + minutes;
            var xhr = new XMLHttpRequest();
            var url = "https://raw.githubusercontent.com/JohannesNE/literature-clock/master/docs/times/" + fileTimeStr + ".json";
            
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var quotesArray = JSON.parse(xhr.responseText);
                            if (quotesArray && quotesArray.length > 0) {
                                var selected = quotesArray[Math.floor(Math.random() * quotesArray.length)];
                                var first = selected.quote_first || "";
                                var timeCase = selected.quote_time_case || "";
                                var last = selected.quote_last || "";
                                
                                var isPortrait = window.matchMedia("(orientation: portrait)").matches;
                                var maxSideLength = isPortrait ? 55 : 130; 
                                
                                var safeEllipsisHtml = '<span class="nobrk-ellipsis">&nbsp;. . .</span>';
                                var safeEllipsisPreHtml = '<span class="nobrk-ellipsis">. . .&nbsp;</span>';

                                if (first.length > maxSideLength) {
                                    var breakPoint = first.indexOf(' ', first.length - maxSideLength);
                                    first = safeEllipsisPreHtml + first.slice(breakPoint === -1 ? first.length - maxSideLength : breakPoint).replace(/^\s+|\s+$/g, '');
                                }
                                if (last.length > maxSideLength) {
                                    var breakPoint = last.lastIndexOf(' ', maxSideLength);
                                    last = last.slice(0, breakPoint === -1 ? maxSideLength : breakPoint).replace(/^\s+|\s+$/g, '') + safeEllipsisHtml;
                                }
                                
                                var displayQuote = first + " <strong>" + timeCase + "</strong> " + last;
                                displayQuote = displayQuote.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                                           .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
                                                           .replace(/<em>(.*?)<\/em>/gi, '<strong>$1</strong>');
                                
                                safeTransitionUpdate('clockQuote', 'clockAuthor', displayQuote, "- <em>" + selected.title + "</em>, " + selected.author);
                            } else {
                                showFallbackTime(hours + ":" + minutes);
                            }
                        } catch (e) {
                            showFallbackTime(hours + ":" + minutes);
                        }
                    } else {
                        showFallbackTime(hours + ":" + minutes);
                    }
                }
            };
            xhr.send();
        }

        function showFallbackTime(timeStr) {
            safeTransitionUpdate('clockQuote', 'clockAuthor', 
                "The clock hands quietly moved to <strong>" + timeStr + "</strong> . . . waiting for the next story.", 
                "- Unknown Timekeeper"
            );
        }

        function setupEventListeners() {
            document.body.addEventListener('touchstart', resetIdleTimer, false);
            document.body.addEventListener('mousemove', resetIdleTimer, false);
            document.body.addEventListener('click', resetIdleTimer, false);
            
            window.addEventListener('resize', function() { 
                lastTimeStr = ""; 
                checkTimeEngine(); 
            }, false);
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (document.getElementById('screensaverOverlay').style.display !== 'block') {
                idleTimer = setTimeout(function() {
                    document.getElementById('screensaverOverlay').style.display = 'block';
                }, idleLimit);
            }
        }

        function wakeUp() {
            document.getElementById('screensaverOverlay').style.display = 'none';
            resetIdleTimer();
            var now = new Date();
            var h = String(now.getHours());
            if(h.length < 2) h = '0' + h;
            var m = String(now.getMinutes());
            if(m.length < 2) m = '0' + m;
            updateClock(h, m);
        }

        window.onload = init;
    </script>
</body>
</html>
