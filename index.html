<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal StandBy Dashboard</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StandBy">
    
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="apple-touch-icon.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #000000; color: #e3e3e6; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; height: 100vh; display: -webkit-flex; display: flex; -webkit-flex-direction: row; flex-direction: row; position: relative; }
        
        .panel { 
            width: 50%; height: 100vh; padding: 60px 50px; 
            display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; 
            -webkit-justify-content: center; justify-content: center; position: relative; 
            -webkit-transition: -webkit-transform 2s ease-in-out;
            transition: transform 2s ease-in-out;
        }
        .left-panel { border-right: 1px solid #222; background-color: #0b0b0c; -webkit-align-items: flex-start; align-items: flex-start; }
        .right-panel { background-color: #050505; -webkit-align-items: center; align-items: center; }
        
        .date-display { position: absolute; top: 40px; left: 50px; font-size: 1.1rem; color: #666; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        .quote-text, .quote-author { -webkit-transition: opacity 0.5s ease-in-out, font-size 0.3s ease, line-height 0.3s ease; transition: opacity 0.5s ease-in-out, font-size 0.3s ease, line-height 0.3s ease; opacity: 1; }
        .quote-text { font-family: 'Georgia', serif; font-weight: 300; text-align: left; word-break: normal; word-wrap: break-word; }
        .right-panel .quote-text { text-align: center; } 
        
        strong { font-weight: 700; color: #ff9f0a; }
        
        .quote-author { font-size: 1.2rem; color: #888; font-family: 'Georgia', serif; margin-top: 10px; -webkit-transition: margin-top 0.3s ease; transition: margin-top 0.3s ease; }
        .quote-author em { font-style: italic; color: #aaa; } 
        .right-panel .quote-author { text-align: center; width: 100%; }

        .weather-info { display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; margin-bottom: 35px; -webkit-transition: margin-bottom 0.3s ease; transition: margin-bottom 0.3s ease; }
        
        #weatherIcon { 
            margin-right: 18px; 
            display: -webkit-inline-flex !important;
            display: inline-flex !important;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: center; justify-content: center;
            -webkit-flex-shrink: 0;
            flex-shrink: 0;
            color: #ff9f0a; 
        }

        #weatherIcon .weather-svg {
            width: 2.8rem !important;
            height: 2.8rem !important;
            display: inline-block;
        }
        
        .weather-info span.temp { font-size: 2.8rem; color: #aaa; font-weight: 200; line-height: 1; margin-right: 18px; }
        .weather-info span.city { font-size: 1.1rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; line-height: 1; margin-bottom: 5px; }

        .nobrk-ellipsis { white-space: nowrap; display: inline-block; color: #666; }

        /* 저대비 새로고침 버튼 */
        .refresh-btn {
            position: absolute;
            top: 40px;
            right: 50px;
            cursor: pointer;
            color: #222;
            opacity: 0.6;
            -webkit-transition: opacity 0.2s, color 0.2s;
            transition: opacity 0.2s, color 0.2s;
            z-index: 1001;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            -webkit-justify-content: center; justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .refresh-btn:hover {
            color: #555;
            opacity: 1;
        }

        .version-label {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 10px;
            color: #2a2a2c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            pointer-events: none;
            z-index: 1000;
        }

        @media (orientation: portrait) {
            body { -webkit-flex-direction: column; flex-direction: column; } 
            .panel { width: 100%; height: 50vh; padding: 40px 40px; }
            .left-panel { border-right: none; border-bottom: 1px solid #222; -webkit-justify-content: flex-end; justify-content: flex-end; padding-bottom: 40px; }
            .right-panel { -webkit-justify-content: flex-start; justify-content: flex-start; padding-top: 40px; }
            .date-display { top: 30px; left: 40px; font-size: 1rem; }
            
            .weather-info { margin-bottom: 20px; }
            
            #weatherIcon { margin-right: 14px; }
            #weatherIcon .weather-svg {
                width: 2.4rem !important;
                height: 2.4rem !important;
            }
            
            .weather-info span.temp { font-size: 2.4rem; margin-right: 14px; }
            .weather-info span.city { font-size: 0.95rem; margin-bottom: 3px; }
            
            .quote-author { font-size: 1.1rem; margin-top: 8px; }

            .refresh-btn {
                top: 30px;
                right: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- 디자인 새로고침 버튼 -->
    <div class="refresh-btn" id="refreshBtn" onclick="forceReload()">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
    </div>

    <!-- 우측 하단 버전 레이블 (v41 자동 업데이트) -->
    <div class="version-label">v41</div>

    <div class="panel left-panel" id="weatherPanel">
        <div class="date-display" id="currentDate">-- --- ----</div>
        <div class="weather-info">
            <span id="weatherIcon">--</span>
            <span class="temp" id="weatherTemp">--°C</span>
            <span class="city" id="cityLabel">DETECTING...</span>
        </div>
        <div class="quote-text" id="weatherQuote">Loading real-time weather...</div>
        <div class="quote-author" id="weatherAuthor"></div>
    </div>

    <div class="panel right-panel" id="clockPanel">
        <div class="quote-text" id="clockQuote">Syncing time with literature...</div>
        <div class="quote-author" id="clockAuthor"></div>
    </div>

    <script>
        var lastTimeStr = ""; 

        var weatherDatabase = {
            "Clear": [
                { q: "Even for me life had its gleams of <strong>sunshine</strong>.", a: "<em>Jane Eyre</em>, Charlotte Brontë" },
                { q: "Some people seemed to get all <strong>sunshine</strong>, and some all shadow.", a: "<em>Little Women</em>, Louisa May Alcott" }
            ],
            "PartlyCloudy": [
                { q: "A <strong>few clouds</strong> floated in a sky otherwise perfectly blue.", a: "<em>The Awakening</em>, Kate Chopin" },
                { q: "The sky was blue, with a <strong>few light clouds</strong> like feathers.", a: "<em>Sons and Lovers</em>, D.H. Lawrence" }
            ],
            "MostlyCloudy": [
                { q: "The sky was <strong>heavy with clouds</strong>, moving rapidly across the moon.", a: "<em>Dracula</em>, Bram Stoker" },
                { q: "The sky was <strong>mostly overcast with clouds</strong>, though now and then a shaft of light broke through.", a: "<em>The Return of the Native</em>, Thomas Hardy" }
            ],
            "Overcast": [
                { q: "In every <strong>cloud</strong>, in every tree—filling the air at night... I am surrounded with her image!", a: "<em>Wuthering Heights</em>, Emily Brontë" },
                { q: "I wandered lonely as a <strong>cloud</strong> that floats on high o'er vales and hills.", a: "<em>I Wandered Lonely as a Cloud</em>, William Wordsworth" }
            ],
            "Rain": [
                { q: "The <strong>rain</strong> continued to fall steadily.", a: "<em>A Farewell to Arms</em>, Ernest Hemingway" },
                { q: "The <strong>rain</strong> pattered dismally against the panes.", a: "<em>Frankenstein</em>, Mary Shelley" }
            ],
            "Snow": [
                { q: "A <strong>snowball</strong> in the face is surely the perfect beginning to a lasting friendship.", a: "<em>The Book Thief</em>, Markus Zusak" },
                { q: "In the falling quiet there was no sky or earth, only <strong>snow</strong> lifting in the wind...", a: "<em>Miriam</em>, Truman Capote" }
            ],
            "Shower": [
                { q: "A sudden <strong>shower</strong> came on, and they were all soaked through.", a: "<em>The Wind in the Willows</em>, Kenneth Grahame" }
            ],
            "Drizzle": [
                { q: "A fine, cold <strong>drizzle</strong> was falling, blurring the outlines of the houses.", a: "<em>The Picture of Dorian Gray</em>, Oscar Wilde" }
            ],
            "Sleet": [
                { q: "The wind blew cold, and a driving <strong>sleet</strong> began to fall, freezing as it touched the ground.", a: "<em>The Call of the Wild</em>, Jack London" }
            ],
            "Hail": [
                { q: "The <strong>hail</strong> rattled on the roof, making such a noise that they could hardly hear each other speak.", a: "<em>The Secret Garden</em>, Frances Hodgson Burnett" }
            ],
            "HeavyRain": [
                { q: "The <strong>torrential rain</strong> fell in a solid wall, erasing the line between earth and sky.", a: "<em>One Hundred Years of Solitude</em>, Gabriel García Márquez" }
            ],
            "HeavySnow": [
                { q: "The day she was buried there came a fall of <strong>snow</strong>; it blew bleak as snow.", a: "<em>Wuthering Heights</em>, Emily Brontë" }
            ],
            "StrongWind": [
                { q: "The <strong>wind was howling</strong> through the trees, shaking the very foundations of the house.", a: "<em>Dracula</em>, Bram Stoker" }
            ],
            "RoughSeas": [
                { q: "The <strong>sea ran mountains high</strong>, and we expected every moment to be swallowed up by the waves.", a: "<em>Robinson Crusoe</em>, Daniel Defoe" }
            ],
            "Dry": [
                { q: "The land was <strong>parched and dry</strong>, the grass turned to a dusty brown under the pitiless sun.", a: "<em>The Grapes of Wrath</em>, John Steinbeck" }
            ],
            "Typhoon": [
                { q: "The fury of the <strong>typhoon</strong> was like the wrath of an angry god, lashed by wind and water.", a: "<em>Typhoon</em>, Joseph Conrad" }
            ],
            "Heatwave": [
                { q: "It was a <strong>blazing hot day</strong> in August, and the city felt like an oven.", a: "<em>The Bell Jar</em>, Sylvia Plath" }
            ],
            "ColdWave": [
                { q: "The <strong>bitter cold</strong> penetrated through their thickest garments, freezing their breath into ice.", a: "<em>The Call of the Wild</em>, Jack London" }
            ]
        };

        // WebKit 렌더 제약을 완전 돌파하는 표준 SVG 렌더러
        function getWeatherSVG(condition) {
            var svgStart = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="weather-svg">';
            var svgEnd = '</svg>';
            var body = '';

            if (condition === "Clear" || condition === "Heatwave") {
                body = '<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
            } else if (condition === "PartlyCloudy" || condition === "MostlyCloudy") {
                body = '<path d="M12 2v2M4.93 4.93l1.41 1.41M2 12h2M6.34 17.66l-1.41 1.41"/><path d="M17.5 10A5.5 5.5 0 0 1 22 15.5h0A3.5 3.5 0 0 1 18.5 19H8.5a4.5 4.5 0 0 1-1-8.9A5.5 5.5 0 0 1 17.5 10z" fill="currentColor" fill-opacity="0.15"/>';
            } else if (condition === "Overcast" || condition === "Dry" || condition === "Typhoon") {
                body = '<path d="M17.5 10A5.5 5.5 0 0 1 22 15.5h0A3.5 3.5 0 0 1 18.5 19H8.5a4.5 4.5 0 0 1-1-8.9A5.5 5.5 0 0 1 17.5 10z" fill="currentColor" fill-opacity="0.2"/>';
            } else if (condition === "Rain" || condition === "HeavyRain" || condition === "Shower") {
                body = '<path d="M17 10a5 5 0 0 1 4.9 5.5A3 3 0 0 1 19 18.5H8.5a4 4 0 0 1-1-7.9A5 5 0 0 1 17 10z"/><path d="M8 21v2M12 21v2M16 21v2"/>';
            } else if (condition === "Snow" || condition === "HeavySnow" || condition === "ColdWave") {
                body = '<path d="M17 10a5 5 0 0 1 4.9 5.5A3 3 0 0 1 19 18.5H8.5a4 4 0 0 1-1-7.9A5 5 0 0 1 17 10z"/><path d="M8 21h.01M12 21h.01M16 21h.01"/>';
            } else if (condition === "Drizzle") {
                body = '<path d="M17 10a5 5 0 0 1 4.9 5.5A3 3 0 0 1 19 18.5H8.5a4 4 0 0 1-1-7.9A5 5 0 0 1 17 10z"/><path d="M8 21h4M12 21h4"/>';
            } else if (condition === "Sleet" || condition === "Hail") {
                body = '<path d="M17 10a5 5 0 0 1 4.9 5.5A3 3 0 0 1 19 18.5H8.5a4 4 0 0 1-1-7.9A5 5 0 0 1 17 10z"/><path d="m7 21 2 2M11 21l2 2M15 21l2 2"/>';
            } else if (condition === "StrongWind" || condition === "RoughSeas") {
                body = '<path d="M2 10h18a2 2 0 1 0-2-2M2 14h15a3 3 0 1 1-3 3M2 18h12a2 2 0 1 0-2-2"/>';
            } else {
                body = '<circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10zM2 12h20"/>';
            }

            return svgStart + body + svgEnd;
        }

        // 초기 구동 안정화 레이어
        function init() {
            try {
                window.addEventListener('resize', function() { lastTimeStr = ""; checkTimeEngine(); }, false);
            } catch(e) {}

            try {
                updateDate();
            } catch(e) {}

            try {
                fetchWeather();
            } catch(e) {}

            try {
                checkTimeEngine();
            } catch(e) {}
            
            setInterval(checkTimeEngine, 1000);
            setInterval(fetchWeather, 30 * 60000);
            setInterval(applyBurnInProtection, 60000); 
        }

        // 캐시 극복용 가상 새로고침
        function forceReload() {
            try {
                var currentUrl = window.location.href.split('?')[0].split('#')[0];
                window.location.replace(currentUrl + '?r=' + new Date().getTime());
            } catch(e) {
                window.location.reload(true);
            }
        }

        function applyBurnInProtection() {
            var shiftX = Math.floor(Math.random() * 7) - 3; 
            var shiftY = Math.floor(Math.random() * 7) - 3;
            
            var panels = document.querySelectorAll('.panel');
            for(var i = 0; i < panels.length; i++) {
                panels[i].style.webkitTransform = "translate(" + shiftX + "px, " + shiftY + "px)";
                panels[i].style.transform = "translate(" + shiftX + "px, " + shiftY + "px)";
            }
        }

        function safeTransitionUpdate(textId, authorId, textHtml, authorHtml) {
            var txtEl = document.getElementById(textId);
            var autEl = document.getElementById(authorId);
            
            if (!txtEl) return; 
            
            txtEl.style.opacity = 0;
            if(autEl) autEl.style.opacity = 0;
            
            setTimeout(function() {
                txtEl.innerHTML = textHtml;
                if(autEl) autEl.innerHTML = authorHtml;
                
                var rawTextLength = txtEl.innerText.length;
                var isPortrait = window.matchMedia("(orientation: portrait)").matches;
                
                if (isPortrait) {
                    if (rawTextLength > 100) {
                        txtEl.style.fontSize = "1.25rem";
                        txtEl.style.lineHeight = "1.4";
                    } else if (rawTextLength > 50) {
                        txtEl.style.fontSize = "1.45rem";
                        txtEl.style.lineHeight = "1.4";
                    } else {
                        txtEl.style.fontSize = "1.75rem";
                        txtEl.style.lineHeight = "1.5";
                    }
                } else {
                    if (rawTextLength > 120) {
                        txtEl.style.fontSize = "1.7rem";
                        txtEl.style.lineHeight = "1.5";
                    } else if (rawTextLength > 75) {
                        txtEl.style.fontSize = "2.0rem";
                        txtEl.style.lineHeight = "1.5";
                    } else {
                        txtEl.style.fontSize = "2.35rem";
                        txtEl.style.lineHeight = "1.6";
                    }
                }
                
                if (textId === 'weatherQuote') {
                    var weatherInfoEl = document.querySelector('.weather-info');
                    if (weatherInfoEl) {
                        if (isPortrait) {
                            if (rawTextLength > 80) {
                                weatherInfoEl.style.marginBottom = "12px";
                                if(autEl) autEl.style.marginTop = "6px";
                            } else {
                                weatherInfoEl.style.marginBottom = "22px";
                                if(autEl) autEl.style.marginTop = "10px";
                            }
                        } else {
                            if (rawTextLength > 100) {
                                weatherInfoEl.style.marginBottom = "20px";
                                if(autEl) autEl.style.marginTop = "8px";
                            } else {
                                weatherInfoEl.style.marginBottom = "38px";
                                if(autEl) autEl.style.marginTop = "14px";
                            }
                        }
                    }
                }
                
                txtEl.style.opacity = 1;
                if(autEl) autEl.style.opacity = 1;
            }, 500);
        }

        function updateDate() {
            var now = new Date();
            var day = String(now.getDate());
            if(day.length < 2) day = '0' + day;
            var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            var dateEl = document.getElementById('currentDate');
            if (dateEl) {
                dateEl.innerText = day + " " + months[now.getMonth()] + " " + now.getFullYear();
            }
        }

        // [중요 수정] 위치 정보 호출을 try-catch로 감싸 지오로케이션 보안 예외가 시계를 정지시키는 현상 전면 예방
        function fetchWeather() {
            try {
                if (navigator.geolocation && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
                    navigator.geolocation.getCurrentPosition(
                        function(position) {
                            var lat = position.coords.latitude;
                            var lon = position.coords.longitude;
                            reverseGeocode(lat, lon);
                        },
                        function(error) {
                            fetchFallbackLocation();
                        },
                        { enableHighAccuracy: true, timeout: 7000 }
                    );
                } else {
                    fetchFallbackLocation();
                }
            } catch (err) {
                // 구형 사파리 Standalone 모드에서 Geolocation이 던지는 동기식 Security Error 발생 시 즉각 IP 연동 폴백 우회
                fetchFallbackLocation();
            }
        }

        function reverseGeocode(lat, lon) {
            try {
                var xhr = new XMLHttpRequest();
                var url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lon;
                
                xhr.open("GET", url, true);
                
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                var res = JSON.parse(xhr.responseText);
                                var cityName = res.address.city || res.address.province || res.address.borough || res.address.county || "Incheon";
                                cleanAndGetWeather(lat, lon, cityName);
                            } catch(e) {
                                fetchFallbackLocation(); 
                            }
                        } else {
                            fetchFallbackLocation(); 
                        }
                    }
                };
                xhr.send();
            } catch (err) {
                fetchFallbackLocation();
            }
        }

        function fetchFallbackLocation() {
            try {
                var xhr = new XMLHttpRequest();
                var url = "https://get.geojs.io/v1/ip/geo.json"; 
                
                xhr.open("GET", url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        var defaultLat = 37.5665;
                        var defaultLon = 126.9780;
                        var defaultCity = "Seoul";
                        
                        if (xhr.status === 200) {
                            try {
                                var data = JSON.parse(xhr.responseText);
                                defaultLat = parseFloat(data.latitude) || defaultLat;
                                defaultLon = parseFloat(data.longitude) || defaultLon;
                                defaultCity = data.city || defaultCity;
                                
                                cleanAndGetWeather(defaultLat, defaultLon, defaultCity);
                            } catch(e) {
                                getWeatherData(defaultLat, defaultLon, defaultCity);
                            }
                        } else {
                            getWeatherData(defaultLat, defaultLon, defaultCity);
                        }
                    }
                };
                xhr.send();
            } catch (err) {
                getWeatherData(37.5665, 126.9780, "Seoul");
            }
        }

        function cleanAndGetWeather(lat, lon, cityName) {
            cityName = cityName.replace(/ Metropolitan City/gi, "")
                               .replace(/ City/gi, "")
                               .replace(/-si/gi, "");
            getWeatherData(lat, lon, cityName);
        }

        function getWeatherData(lat, lon, cityName) {
            try {
                var xhr = new XMLHttpRequest();
                var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m";
                
                xhr.open("GET", url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                var data = JSON.parse(xhr.responseText);
                                var temp = Math.round(data.current.temperature_2m);
                                var code = data.current.weather_code;
                                var wind = data.current.wind_speed_10m;
                                var humidity = data.current.relative_humidity_2m;
                                
                                var condition = "Clear";
                                
                                if (temp >= 33) condition = "Heatwave";
                                else if (temp <= -10) condition = "ColdWave";
                                else if (wind >= 50 && (code === 95 || code === 96 || code === 99)) condition = "Typhoon";
                                else if (wind >= 50) condition = "RoughSeas";
                                else if (wind >= 39) condition = "StrongWind";
                                else if (humidity <= 30 && code <= 3) condition = "
