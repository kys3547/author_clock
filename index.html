<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal StandBy Dashboard</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StandBy">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3593/3593455.png">

    <style>
        /* 미니멀 다크 테마 기본 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #0b0b0c; color: #e3e3e6; font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: row; }
        
        /* 기본 데스크탑/아이패드 가로 레이아웃 (Landscape) */
        .panel { width: 50%; height: 100vh; padding: 60px 50px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .left-panel { border-right: 1px solid #222; background-color: #0b0b0c; align-items: flex-start; }
        .right-panel { background-color: #050505; align-items: center; }
        
        /* 실시간 날짜 표시 (좌측 상단) */
        .date-display { position: absolute; top: 40px; left: 50px; font-size: 1.1rem; color: #666; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        /* 문구 및 저자 텍스트 페이드 전환 효과 */
        .quote-text, .quote-author { transition: opacity 0.5s ease-in-out; opacity: 1; }
        .quote-text { font-family: 'Georgia', serif; font-weight: 300; text-align: left; }
        .right-panel .quote-text { text-align: center; } 
        
        strong { font-weight: 700; color: #ffffff; }
        .quote-author { font-size: 1.2rem; color: #888; font-family: 'Georgia', serif; margin-top: 10px; }
        .quote-author em { font-style: italic; color: #aaa; } 
        .right-panel .quote-author { text-align: center; width: 100%; }

        /* 날씨 정보 레이아웃 바닥 밀착형 */
        .weather-info { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 35px; }
        #weatherIcon { font-size: 3.5rem; line-height: 1; }
        .weather-info span.temp { font-size: 2.5rem; color: #aaa; font-weight: 200; line-height: 1; }
        .weather-info span.city { font-size: 1.1rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; line-height: 1; margin-bottom: 3px; }

        /* 내장 화면 보호기 */
        .screensaver { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 1000; cursor: pointer; }

        /* 🔄 [반응형 핵심 수정] 아이패드/스마트폰 '세로 모드' 통합 최적화 */
        @media (orientation: portrait) {
            body { flex-direction: column; } /* 어떤 기기든 세로로 돌리면 위아래 분할 */
            
            .panel { width: 100%; height: 50vh; padding: 40px 40px; }
            .left-panel { border-right: none; border-bottom: 1px solid #222; justify-content: flex-end; padding-bottom: 40px; }
            .right-panel { justify-content: flex-start; padding-top: 40px; }
            
            /* 세로 모드 UI 크기 정밀 밸런싱 */
            .date-display { top: 30px; left: 40px; font-size: 1rem; }
            .weather-info { margin-bottom: 20px; gap: 12px; }
            #weatherIcon { font-size: 3rem; }
            .weather-info span.temp { font-size: 2.2rem; }
            .weather-info span.city { font-size: 0.95rem; }
            .quote-author { font-size: 1.1rem; margin-top: 8px; }
        }
    </style>
</head>

        async function init() {
            resetIdleTimer();
            setupEventListeners();
            updateDate();
            await fetchWeather();
            checkTimeEngine();
            setInterval(checkTimeEngine, 1000);
            setInterval(fetchWeather, 30 * 60000);
        }

        // 📐 디바이스 회전 상태(Portrait 여부)를 파악하여 폰트 크기를 매칭하는 엔진
        function safeTransitionUpdate(textId, authorId, textHtml, authorHtml) {
            const txtEl = document.getElementById(textId);
            const autEl = document.getElementById(authorId);
            
            txtEl.style.opacity = 0;
            if(autEl) autEl.style.opacity = 0;
            
            setTimeout(() => {
                txtEl.innerHTML = textHtml;
                if(autEl) autEl.innerHTML = authorHtml;
                
                const rawTextLength = txtEl.innerText.length;
                // 🔄 미디어 쿼리와 완벽 동기화: 화면이 세로 모드(Portrait) 상태인지 확인
                const isPortrait = window.matchMedia("(orientation: portrait)").matches;
                
                if (isPortrait) {
                    // 📱 세로 분할 모드 전용 컴팩트 가변형 폰트 (아이패드 세로 및 스마트폰 대응)
                    if (rawTextLength > 100) {
                        txtEl.style.fontSize = "1.3rem";
                        txtEl.style.lineHeight = "1.4";
                    } else if (rawTextLength > 50) {
                        txtEl.style.fontSize = "1.5rem";
                        txtEl.style.lineHeight = "1.4";
                    } else {
                        txtEl.style.fontSize = "1.8rem";
                        txtEl.style.lineHeight = "1.5";
                    }
                } else {
                    // 💻 가로 분할 모드 전용 와이드 폰트 (PC 및 아이패드 가로 대응)
                    if (rawTextLength > 120) {
                        txtEl.style.fontSize = "1.75rem";
                        txtEl.style.lineHeight = "1.5";
                    } else if (rawTextLength > 75) {
                        txtEl.style.fontSize = "2.05rem";
                        txtEl.style.lineHeight = "1.5";
                    } else {
                        txtEl.style.fontSize = "2.4rem";
                        txtEl.style.lineHeight = "1.6";
                    }
                }
                
                txtEl.style.opacity = 1;
                if(autEl) autEl.style.opacity = 1;
            }, 500);
        }

        function updateDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            document.getElementById('currentDate').innerText = `${day} ${months[now.getMonth()]} ${now.getFullYear()}`;
        }

        async function fetchWeather() {
            let lat = 37.5665; let lon = 126.9780; let cityName = "Seoul";
            try {
                const locResponse = await fetch("https://ipapi.co/json/");
                if (locResponse.ok) {
                    const locData = await locResponse.json();
                    lat = locData.latitude || lat; lon = locData.longitude || lon; cityName = locData.city || cityName;
                }
            } catch (e) { console.log("Location detection failed."); }

            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`);
                if (!response.ok) throw new Error("Offline");
                const data = await response.json();
                
                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;
                const wind = data.current.wind_speed_10m;
                const humidity = data.current.relative_humidity_2m;
                
                let condition = "Clear";
                
                if (temp >= 33) condition = "Heatwave";
                else if (temp <= -10) condition = "ColdWave";
                else if (wind >= 50 && (code === 95 || code === 96 || code === 99)) condition = "Typhoon";
                else if (wind >= 50) condition = "RoughSeas";
                else if (wind >= 39) condition = "StrongWind";
                else if (humidity <= 30 && code <= 3) condition = "Dry";
                else {
                    if (code === 0) condition = "Clear";
                    else if (code === 1) condition = "PartlyCloudy";
                    else if (code === 2) condition = "MostlyCloudy";
                    else if (code === 3 || code === 45 || code === 48) condition = "Overcast";
                    else if (code === 51 || code === 53 || code === 55) condition = "Drizzle";
                    else if (code === 61 || code === 63) condition = "Rain";
                    else if (code === 65) condition = "HeavyRain";
                    else if (code === 66 || code === 67 || code === 77) condition = "Sleet";
                    else if (code === 71 || code === 73) condition = "Snow";
                    else if (code === 75) condition = "HeavySnow";
                    else if (code === 80 || code === 81) condition = "Shower";
                    else if (code === 82 || code === 85 || code === 86 || code === 95) condition = "HeavyRain"; 
                    else if (code === 96 || code === 99) condition = "Hail";
                }

                const quotesList = weatherDatabase[condition];
                const match = quotesList[Math.floor(Math.random() * quotesList.length)];

                document.getElementById('weatherIcon').innerText = match.icon;
                document.getElementById('weatherTemp').innerText = `${temp}°C`;
                document.getElementById('cityLabel').innerText = `${cityName} (${match.label})`;
                
                safeTransitionUpdate('weatherQuote', 'weatherAuthor', match.q, `- ${match.a}`);
            } catch (error) {
                safeTransitionUpdate('weatherQuote', 'weatherAuthor', 
                    "The connection to the world was severed; the sky remained an <strong>unreadable page</strong>.", 
                    "- The Offline Chronicler"
                );
                document.getElementById('weatherIcon').innerText = "🌐";
                document.getElementById('weatherTemp').innerText = "Offline";
                document.getElementById('cityLabel').innerText = "Disconnected";
            }
        }

        function checkTimeEngine() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${hours}:${minutes}`;

            if (currentTimeStr !== lastTimeStr) {
                lastTimeStr = currentTimeStr;
                updateClock(hours, minutes);
                updateDate();
            }
        }

        async function updateClock(hours, minutes) {
            const fileTimeStr = `${hours}_${minutes}`;
            try {
                const response = await fetch(`https://raw.githubusercontent.com/JohannesNE/literature-clock/master/docs/times/${fileTimeStr}.json`);
                if (!response.ok) throw new Error("Fetch failed");
                const quotesArray = await response.json();
                
                if (quotesArray && quotesArray.length > 0) {
                    const selected = quotesArray[Math.floor(Math.random() * quotesArray.length)];
                    let first = selected.quote_first || "";
                    let timeCase = selected.quote_time_case || "";
                    let last = selected.quote_last || "";
                    
                    // 🔄 [세로 모드 최적화] 세로 상태일 때 문장 최대 길이를 55자로 제어
                    const isPortrait = window.matchMedia("(orientation: portrait)").matches;
                    const maxSideLength = isPortrait ? 55 : 130; 
                    
                    if (first.length > maxSideLength) {
                        let breakPoint = first.indexOf(' ', first.length - maxSideLength);
                        first = ". . . " + first.slice(breakPoint === -1 ? first.length - maxSideLength : breakPoint).trim();
                    }
                    if (last.length > maxSideLength) {
                        let breakPoint = last.lastIndexOf(' ', maxSideLength);
                        last = last.slice(0, breakPoint === -1 ? maxSideLength : breakPoint).trim() + " . . .";
                    }
                    
                    let displayQuote = `${first} <strong>${timeCase}</strong> ${last}`;
                    displayQuote = displayQuote.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                               .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
                                               .replace(/<em>(.*?)<\/em>/gi, '<strong>$1</strong>');
                    
                    safeTransitionUpdate('clockQuote', 'clockAuthor', displayQuote, `- <em>${selected.title}</em>, ${selected.author}`);
                } else {
                    showFallbackTime(`${hours}:${minutes}`);
                }
            } catch (error) {
                showFallbackTime(`${hours}:${minutes}`);
            }
        }

        function showFallbackTime(timeStr) {
            safeTransitionUpdate('clockQuote', 'clockAuthor', 
                `The clock hands quietly moved to <strong>${timeStr}</strong> . . . waiting for the next story.`, 
                "- Unknown Timekeeper"
            );
        }

        function setupEventListeners() {
            document.body.addEventListener('touchstart', resetIdleTimer);
            document.body.addEventListener('mousemove', resetIdleTimer);
            document.body.addEventListener('click', resetIdleTimer);
            
            // 🔄 디바이스 회전 시 실시간 레이아웃 및 폰트 재계산 연동
            window.addEventListener('resize', () => { lastTimeStr = ""; checkTimeEngine(); });
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (document.getElementById('screensaverOverlay').style.display !== 'block') {
                idleTimer = setTimeout(() => {
                    document.getElementById('screensaverOverlay').style.display = 'block';
                }, idleLimit);
            }
        }

        function wakeUp() {
            document.getElementById('screensaverOverlay').style.display = 'none';
            resetIdleTimer();
            const now = new Date();
            updateClock(String(now.getHours()).padStart(2, '0'), String(now.getMinutes()).padStart(2, '0'));
        }

        window.onload = init;
    </script>
</body>
