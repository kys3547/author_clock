<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal StandBy Dashboard</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StandBy">
    
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="apple-touch-icon.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background-color: #000000; color: #e3e3e6; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; height: 100vh; display: -webkit-flex; display: flex; -webkit-flex-direction: row; flex-direction: row; }
        
        .panel { 
            width: 50%; height: 100vh; padding: 60px 50px; 
            display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; 
            -webkit-justify-content: center; justify-content: center; position: relative; 
            -webkit-transition: -webkit-transform 2s ease-in-out;
            transition: transform 2s ease-in-out;
        }
        .left-panel { border-right: 1px solid #222; background-color: #0b0b0c; -webkit-align-items: flex-start; align-items: flex-start; }
        .right-panel { background-color: #050505; -webkit-align-items: center; align-items: center; }
        
        .date-display { position: absolute; top: 40px; left: 50px; font-size: 1.1rem; color: #666; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        .quote-text, .quote-author { -webkit-transition: opacity 0.5s ease-in-out, font-size 0.3s ease, line-height 0.3s ease; transition: opacity 0.5s ease-in-out, font-size 0.3s ease, line-height 0.3s ease; opacity: 1; }
        .quote-text { font-family: 'Georgia', serif; font-weight: 300; text-align: left; word-break: normal; word-wrap: break-word; }
        .right-panel .quote-text { text-align: center; } 
        
        strong { font-weight: 700; color: #ff9f0a; }
        
        .quote-author { font-size: 1.2rem; color: #888; font-family: 'Georgia', serif; margin-top: 10px; -webkit-transition: margin-top 0.3s ease; transition: margin-top 0.3s ease; }
        .quote-author em { font-style: italic; color: #aaa; } 
        .right-panel .quote-author { text-align: center; width: 100%; }

        .weather-info { display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; margin-bottom: 35px; -webkit-transition: margin-bottom 0.3s ease; transition: margin-bottom 0.3s ease; }
        #weatherIcon { font-size: 4.5rem; line-height: 1; margin-right: 18px; }
        .weather-info span.temp { font-size: 2.8rem; color: #aaa; font-weight: 200; line-height: 1; margin-right: 18px; }
        .weather-info span.city { font-size: 1.1rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; line-height: 1; margin-bottom: 5px; }

        .nobrk-ellipsis { white-space: nowrap; display: inline-block; color: #666; }

        /* --- 구형 Safari 브라우저 대응을 위한 CSS 수정 --- */
        .aod-container {
            position: absolute;
            top: 40px;
            right: 50px;
            display: -webkit-flex; display: flex;
            -webkit-align-items: center; align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            color: #888; 
            opacity: 0.8; 
            z-index: 1000;
        }
        /* gap 대신 margin-right 속성을 사용하여 간격 조절 */
        .aod-container #aodLabel {
            margin-right: 8px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 30px;
            height: 16px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #222;
            border: 1px solid #333;
            -webkit-transition: .3s; transition: .3s;
            border-radius: 16px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 10px; width: 10px;
            left: 2px; bottom: 2px;
            background-color: #555;
            -webkit-transition: .3s; transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #1a4a25;
            border-color: #2e7d32;
        }
        input:checked + .slider:before {
            -webkit-transform: translateX(14px); transform: translateX(14px);
            background-color: #81c784;
        }
        /* ---------------------------------- */

        @media (orientation: portrait) {
            body { -webkit-flex-direction: column; flex-direction: column; } 
            .panel { width: 100%; height: 50vh; padding: 40px 40px; }
            .left-panel { border-right: none; border-bottom: 1px solid #222; -webkit-justify-content: flex-end; justify-content: flex-end; padding-bottom: 40px; }
            .right-panel { -webkit-justify-content: flex-start; justify-content: flex-start; padding-top: 40px; }
            .date-display { top: 30px; left: 40px; font-size: 1rem; }
            
            .weather-info { margin-bottom: 20px; }
            #weatherIcon { font-size: 3.8rem; margin-right: 14px; }
            .weather-info span.temp { font-size: 2.4rem; margin-right: 14px; }
            .weather-info span.city { font-size: 0.95rem; margin-bottom: 3px; }
            
            .quote-author { font-size: 1.1rem; margin-top: 8px; }

            .aod-container { top: 30px; right: 40px; }
        }
    </style>
</head>
<body>

    <div class="aod-container">
        <span id="aodLabel">AOD OFF</span>
        <label class="switch">
            <input type="checkbox" id="aodToggle">
            <span class="slider"></span>
        </label>
    </div>

    <div class="panel left-panel" id="weatherPanel">
        <div class="date-display" id="currentDate">-- --- ----</div>
        <div class="weather-info">
            <span id="weatherIcon">--</span>
            <span class="temp" id="weatherTemp">--°C</span>
            <span class="city" id="cityLabel">DETECTING...</span>
        </div>
        <div class="quote-text" id="weatherQuote">Loading real-time weather...</div>
        <div class="quote-author" id="weatherAuthor"></div>
    </div>

    <div class="panel right-panel" id="clockPanel">
        <div class="quote-text" id="clockQuote">Syncing time with literature...</div>
        <div class="quote-author" id="clockAuthor"></div>
    </div>

    <script>
        var lastTimeStr = ""; 

        var weatherDatabase = {
            "Clear": [
                { q: "Even for me life had its gleams of <strong>sunshine</strong>.", a: "<em>Jane Eyre</em>, Charlotte Brontë", icon: "☀️" },
                { q: "Some people seemed to get all <strong>sunshine</strong>, and some all shadow.", a: "<em>Little Women</em>, Louisa May Alcott", icon: "☀️" }
            ],
            "PartlyCloudy": [
                { q: "A <strong>few clouds</strong> floated in a sky otherwise perfectly blue.", a: "<em>The Awakening</em>, Kate Chopin", icon: "🌤️" },
                { q: "The sky was blue, with a <strong>few light clouds</strong> like feathers.", a: "<em>Sons and Lovers</em>, D.H. Lawrence", icon: "🌤️" }
            ],
            "MostlyCloudy": [
                { q: "The sky was <strong>heavy with clouds</strong>, moving rapidly across the moon.", a: "<em>Dracula</em>, Bram Stoker", icon: "⛅" },
                { q: "The sky was <strong>mostly overcast with clouds</strong>, though now and then a shaft of light broke through.", a: "<em>The Return of the Native</em>, Thomas Hardy", icon: "⛅" }
            ],
            "Overcast": [
                { q: "In every <strong>cloud</strong>, in every tree—filling the air at night... I am surrounded with her image!", a: "<em>Wuthering Heights</em>, Emily Brontë", icon: "☁️" },
                { q: "I wandered lonely as a <strong>cloud</strong> that floats on high o'er vales and hills.", a: "<em>I Wandered Lonely as a Cloud</em>, William Wordsworth", icon: "☁️" }
            ],
            "Rain": [
                { q: "The <strong>rain</strong> continued to fall steadily.", a: "<em>A Farewell to Arms</em>, Ernest Hemingway", icon: "🌧️" },
                { q: "The <strong>rain</strong> pattered dismally against the panes.", a: "<em>Frankenstein</em>, Mary Shelley", icon: "🌧️" }
            ],
            "Snow": [
                { q: "A <strong>snowball</strong> in the face is surely the perfect beginning to a lasting friendship.", a: "<em>The Book Thief</em>, Markus Zusak", icon: "❄️" },
                { q: "In the falling quiet there was no sky or earth, only <strong>snow</strong> lifting in the wind...", a: "<em>Miriam</em>, Truman Capote", icon: "❄️" }
            ],
            "Shower": [
                { q: "A sudden <strong>shower</strong> came on, and they were all soaked through.", a: "<em>The Wind in the Willows</em>, Kenneth Grahame", icon: "🌦️" }
            ],
            "Drizzle": [
                { q: "A fine, cold <strong>drizzle</strong> was falling, blurring the outlines of the houses.", a: "<em>The Picture of Dorian Gray</em>, Oscar Wilde", icon: "🌫️" }
            ],
            "Sleet": [
                { q: "The wind blew cold, and a driving <strong>sleet</strong> began to fall, freezing as it touched the ground.", a: "<em>The Call of the Wild</em>, Jack London", icon: "🌨️" }
            ],
            "Hail": [
                { q: "The <strong>hail</strong> rattled on the roof, making such a noise that they could hardly hear each other speak.", a: "<em>The Secret Garden</em>, Frances Hodgson Burnett", icon: "☄️" }
            ],
            "HeavyRain": [
                { q: "The <strong>torrential rain</strong> fell in a solid wall, erasing the line between earth and sky.", a: "<em>One Hundred Years of Solitude</em>, Gabriel García Márquez", icon: "🌊" }
            ],
            "HeavySnow": [
                { q: "The day she was buried there came a fall of <strong>snow</strong>; it blew bleak as snow.", a: "<em>Wuthering Heights</em>, Emily Brontë", icon: "☃️" }
            ],
            "StrongWind": [
                { q: "The <strong>wind was howling</strong> through the trees, shaking the very foundations of the house.", a: "<em>Dracula</em>, Bram Stoker", icon: "💨" }
            ],
            "RoughSeas": [
                { q: "The <strong>sea ran mountains high</strong>, and we expected every moment to be swallowed up by the waves.", a: "<em>Robinson Crusoe</em>, Daniel Defoe", icon: "⚓" }
            ],
            "Dry": [
                { q: "The land was <strong>parched and dry</strong>, the grass turned to a dusty brown under the pitiless sun.", a: "<em>The Grapes of Wrath</em>, John Steinbeck", icon: "🏜️" }
            ],
            "Typhoon": [
                { q: "The fury of the <strong>typhoon</strong> was like the wrath of an angry god, lashed by wind and water.", a: "<em>Typhoon</em>, Joseph Conrad", icon: "🌀" }
            ],
            "Heatwave": [
                { q: "It was a <strong>blazing hot day</strong> in August, and the city felt like an oven.", a: "<em>The Bell Jar</em>, Sylvia Plath", icon: "🥵" }
            ],
            "ColdWave": [
                { q: "The <strong>bitter cold</strong> penetrated through their thickest garments, freezing their breath into ice.", a: "<em>The Call of the Wild</em>, Jack London", icon: "🥶" }
            ]
        };

        function init() {
            window.addEventListener('resize', function() { lastTimeStr = ""; checkTimeEngine(); }, false);
            updateDate();
            fetchWeather();
            checkTimeEngine();
            
            setInterval(checkTimeEngine, 1000);
            setInterval(fetchWeather, 30 * 60000);
            setInterval(applyBurnInProtection, 60000); 
        }

        function applyBurnInProtection() {
            var shiftX = Math.floor(Math.random() * 7) - 3; 
            var shiftY = Math.floor(Math.random() * 7) - 3;
            
            var panels = document.querySelectorAll('.panel');
            for(var i = 0; i < panels.length; i++) {
                panels[i].style.webkitTransform = "translate(" + shiftX + "px, " + shiftY + "px)";
                panels[i].style.transform = "translate(" + shiftX + "px, " + shiftY + "px)";
            }
        }

        function safeTransitionUpdate(textId, authorId, textHtml, authorHtml) {
            var txtEl = document.getElementById(textId);
            var autEl = document.getElementById(authorId);
            
            if (!txtEl) return; // 요소 누락 시 에러 전파 방지
            
            txtEl.style.opacity = 0;
            if(autEl) autEl.style.opacity = 0;
            
            setTimeout(function() {
                txtEl.innerHTML = textHtml;
                if(autEl) autEl.innerHTML = authorHtml;
                
                var rawTextLength = txtEl.innerText.length;
                var isPortrait = window.matchMedia("(orientation: portrait)").matches;
                
                if (isPortrait) {
                    if (rawTextLength > 100) {
                        txtEl.style.fontSize = "1.25rem";
                        txtEl.style.lineHeight = "1.4";
                    } else if (rawTextLength > 50) {
                        txtEl.style.fontSize = "1.45rem";
                        txtEl.style.lineHeight = "1.4";
                    } else {
                        txtEl.style.fontSize = "1.75rem";
                        txtEl.style.lineHeight = "1.5";
                    }
                } else {
                    if (rawTextLength > 120) {
                        txtEl.style.fontSize = "1.7rem";
                        txtEl.style.lineHeight = "1.5";
                    } else if (rawTextLength > 75) {
                        txtEl.style.fontSize = "2.0rem";
                        txtEl.style.lineHeight = "1.5";
                    } else {
                        txtEl.style.fontSize = "2.35rem";
                        txtEl.style.lineHeight = "1.6";
                    }
                }
                
                if (textId === 'weatherQuote') {
                    var weatherInfoEl = document.querySelector('.weather-info');
                    if (weatherInfoEl) {
                        if (isPortrait) {
                            if (rawTextLength > 80) {
                                weatherInfoEl.style.marginBottom = "12px";
                                if(autEl) autEl.style.marginTop = "6px";
                            } else {
                                weatherInfoEl.style.marginBottom = "22px";
                                if(autEl) autEl.style.marginTop = "10px";
                            }
                        } else {
                            if (rawTextLength > 100) {
                                weatherInfoEl.style.marginBottom = "20px";
                                if(autEl) autEl.style.marginTop = "8px";
                            } else {
                                weatherInfoEl.style.marginBottom = "38px";
                                if(autEl) autEl.style.marginTop = "14px";
                            }
                        }
                    }
                }
                
                txtEl.style.opacity = 1;
                if(autEl) autEl.style.opacity = 1;
            }, 500);
        }

        function updateDate() {
            var now = new Date();
            var day = String(now.getDate());
            if(day.length < 2) day = '0' + day;
            var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            var dateEl = document.getElementById('currentDate');
            if (dateEl) {
                dateEl.innerText = day + " " + months[now.getMonth()] + " " + now.getFullYear();
            }
        }

        function fetchWeather() {
            if (navigator.geolocation && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        var lat = position.coords.latitude;
                        var lon = position.coords.longitude;
                        reverseGeocode(lat, lon);
                    },
                    function(error) {
                        fetchFallbackLocation();
                    },
                    { enableHighAccuracy: true, timeout: 7000 }
                );
            } else {
                fetchFallbackLocation();
            }
        }

        function reverseGeocode(lat, lon) {
            var xhr = new XMLHttpRequest();
            var url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lon;
            
            xhr.open("GET", url, true);
            xhr.setRequestHeader("User-Agent", "StandByDashboard/1.5"); 
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var res = JSON.parse(xhr.responseText);
                            var cityName = res.address.city || res.address.province || res.address.borough || res.address.county || "Incheon";
                            cleanAndGetWeather(lat, lon, cityName);
                        } catch(e) {
                            fetchFallbackLocation(); 
                        }
                    } else {
                        fetchFallbackLocation(); 
                    }
                }
            };
            xhr.send();
        }

        function fetchFallbackLocation() {
            var xhr = new XMLHttpRequest();
            var url = "https://get.geojs.io/v1/ip/geo.json"; 
            
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var defaultLat = 37.5665;
                    var defaultLon = 126.9780;
                    var defaultCity = "Seoul";
                    
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            defaultLat = parseFloat(data.latitude) || defaultLat;
                            defaultLon = parseFloat(data.longitude) || defaultLon;
                            defaultCity = data.city || defaultCity;
                            
                            cleanAndGetWeather(defaultLat, defaultLon, defaultCity);
                        } catch(e) {
                            getWeatherData(defaultLat, defaultLon, defaultCity);
                        }
                    } else {
                        getWeatherData(defaultLat, defaultLon, defaultCity);
                    }
                }
            };
            xhr.send();
        }

        function cleanAndGetWeather(lat, lon, cityName) {
            cityName = cityName.replace(/ Metropolitan City/gi, "")
                               .replace(/ City/gi, "")
                               .replace(/-si/gi, "");
            getWeatherData(lat, lon, cityName);
        }

        function getWeatherData(lat, lon, cityName) {
            var xhr = new XMLHttpRequest();
            var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m";
            
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            var temp = Math.round(data.current.temperature_2m);
                            var code = data.current.weather_code;
                            var wind = data.current.wind_speed_10m;
                            var humidity = data.current.relative_humidity_2m;
                            
                            var condition = "Clear";
                            
                            if (temp >= 33) condition = "Heatwave";
                            else if (temp <= -10) condition = "ColdWave";
                            else if (wind >= 50 && (code === 95 || code === 96 || code === 99)) condition = "Typhoon";
                            else if (wind >= 50) condition = "RoughSeas";
                            else if (wind >= 39) condition = "StrongWind";
                            else if (humidity <= 30 && code <= 3) condition = "Dry";
                            else {
                                if (code === 0) condition = "Clear";
                                else if (code === 1) condition = "PartlyCloudy";
                                else if (code === 2) condition = "MostlyCloudy";
                                else if (code === 3 || code === 45 || code === 48) condition = "Overcast";
                                else if (code === 51 || code === 53 || code === 55) condition = "Drizzle";
                                else if (code === 61 || code === 63) condition = "Rain";
                                else if (code === 65) condition = "HeavyRain";
                                else if (code === 66 || code === 67 || code === 77) condition = "Sleet";
                                else if (code === 71 || code === 73) condition = "Snow";
                                else if (code === 75) condition = "HeavySnow";
                                else if (code === 80 || code === 81) condition = "Shower";
                                else if (code === 82 || code === 85 || code === 86 || code === 95) condition = "HeavyRain"; 
                                else if (code === 96 || code === 99) condition = "Hail";
                            }

                            var quotesList = weatherDatabase[condition];
                            var match = quotesList[Math.floor(Math.random() * quotesList.length)];

                            var wIcon = document.getElementById('weatherIcon');
                            var wTemp = document.getElementById('weatherTemp');
                            var cLabel = document.getElementById('cityLabel');
                            if(wIcon) wIcon.innerText = match.icon;
                            if(wTemp) wTemp.innerText = temp + "°C";
                            if(cLabel) cLabel.innerText = cityName.toUpperCase();
                            
                            safeTransitionUpdate('weatherQuote', 'weatherAuthor', match.q, "- " + match.a);
                        } catch (e) {
                            showOfflineWeather();
                        }
                    } else {
                        showOfflineWeather();
                    }
                }
            };
            xhr.send();
        }

        function showOfflineWeather() {
            safeTransitionUpdate('weatherQuote', 'weatherAuthor', 
                "The connection to the world was severed; the sky remained an <strong>unreadable page</strong>.", 
                "- The Offline Chronicler"
            );
            var wIcon = document.getElementById('weatherIcon');
            var wTemp = document.getElementById('weatherTemp');
            var cLabel = document.getElementById('cityLabel');
            if(wIcon) wIcon.innerText = "🌐";
            if(wTemp) wTemp.innerText = "Offline";
            if(cLabel) cLabel.innerText = "DISCONNECTED";
        }

        function checkTimeEngine() {
            var now = new Date();
            var hours = String(now.getHours());
            if(hours.length < 2) hours = '0' + hours;
            var minutes = String(now.getMinutes());
            if(minutes.length < 2) minutes = '0' + minutes;
            var currentTimeStr = hours + ":" + minutes;

            if (currentTimeStr !== lastTimeStr) {
                lastTimeStr = currentTimeStr;
                updateClock(hours, minutes);
                updateDate();
            }
        }

        function updateClock(hours, minutes) {
            if (hours === "18" && minutes === "52") {
                var customQuote = "“Let's give her a minute and then move in at exactly”—Randi checked the watch on her wrist... “<strong>six fifty-two</strong>,” she ordered.";
                var customAuthor = "- <em>The Sweetest Heist in History</em>, Octavia Spencer";
                safeTransitionUpdate('clockQuote', 'clockAuthor', customQuote, customAuthor);
                return;
            }

            var fileTimeStr = hours + "_" + minutes;
            var xhr = new XMLHttpRequest();
            var url = "https://raw.githubusercontent.com/JohannesNE/literature-clock/master/docs/times/" + fileTimeStr + ".json";
            
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var quotesArray = JSON.parse(xhr.responseText);
                            if (quotesArray && quotesArray.length > 0) {
                                var selected = quotesArray[Math.floor(Math.random() * quotesArray.length)];
                                var first = selected.quote_first || "";
                                var timeCase = selected.quote_time_case || "";
                                var last = selected.quote_last || "";
                                
                                var isPortrait = window.matchMedia("(orientation: portrait)").matches;
                                var maxSideLength = isPortrait ? 55 : 130; 
                                
                                var safeEllipsisHtml = '<span class="nobrk-ellipsis">&nbsp;. . .</span>';
                                var safeEllipsisPreHtml = '<span class="nobrk-ellipsis">. . .&nbsp;</span>';

                                if (first.length > maxSideLength) {
                                    var cutIndex = first.length - maxSideLength;
                                    var firstSentenceEnd = first.indexOf('.', cutIndex);
                                    if (firstSentenceEnd === -1 || firstSentenceEnd >= first.length - 10) firstSentenceEnd = first.indexOf('?', cutIndex);
                                    if (firstSentenceEnd === -1 || firstSentenceEnd >= first.length - 10) firstSentenceEnd = first.indexOf('!', cutIndex);
                                    
                                    if (firstSentenceEnd !== -1 && firstSentenceEnd < first.length - 5) {
                                        first = safeEllipsisPreHtml + first.slice(firstSentenceEnd + 1).replace(/^\s+|\s+$/g, '');
                                    } else {
                                        var breakPoint = first.indexOf(' ', cutIndex);
                                        first = safeEllipsisPreHtml + first.slice(breakPoint === -1 ? cutIndex : breakPoint).replace(/^\s+|\s+$/g, '');
                                    }
                                }

                                if (last.length > maxSideLength) {
                                    var subLast = last.slice(0, maxSideLength);
                                    var lastPeriod = subLast.lastIndexOf('.');
                                    var lastQuestion = subLast.lastIndexOf('?');
                                    var lastExclamation = subLast.lastIndexOf('!');
                                    
                                    var lastSentenceEnd = Math.max(lastPeriod, lastQuestion, lastExclamation);
                                    
                                    if (lastSentenceEnd > 15) {
                                        last = last.slice(0, lastSentenceEnd + 1).replace(/^\s+|\s+$/g, '') + safeEllipsisHtml;
                                    } else {
                                        var breakPoint = subLast.lastIndexOf(' ');
                                        last = last.slice(0, breakPoint === -1 ? maxSideLength : breakPoint).replace(/^\s+|\s+$/g, '') + safeEllipsisHtml;
                                    }
                                }
                                
                                var displayQuote = first + " <strong>" + timeCase + "</strong> " + last;
                                displayQuote = displayQuote.replace(/\*\*(.*?)\*\"/g, '<strong>$1</strong>')
                                                           .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
                                                           .replace(/<em>(.*?)<\/em>/gi, '<strong>$1</strong>');
                                
                                safeTransitionUpdate('clockQuote', 'clockAuthor', displayQuote, "- <em>" + selected.title + "</em>, " + selected.author);
                            } else {
                                showFallbackTime(hours + ":" + minutes);
                            }
                        } catch (e) {
                            showFallbackTime(hours + ":" + minutes);
                        }
                    } else {
                        showFallbackTime(hours + ":" + minutes);
                    }
                }
            };
            xhr.send();
        }

        function showFallbackTime(timeStr) {
            safeTransitionUpdate('clockQuote', 'clockAuthor', 
                "The clock hands quietly moved to <strong>" + timeStr + "</strong> . . . waiting for the next story.", 
                "- Unknown Timekeeper"
            );
        }

        // --- 구형 기기 및 일반 기기를 동시 커버하는 AOD 로직 ---
        var wakeLock = null;
        var legacyVideo = null; // iOS 10 이상 대비 비디오 인스턴스
        var legacyIframe = null; // iOS 9 이하 standalone PWA 보안 리다이렉션을 위한 iframe 인스턴스
        var legacyTimer = null; // 하이브리드 강제 차단 타이머

        // 구형 iOS 환경에서 화면 꺼짐을 막기 위한 보이지 않는 무음 루프 비디오 구동 함수
        function enableLegacyAOD() {
            // 1. 비디오 루프 기법 가동 (iOS 10 이상 및 일반 뷰포트 내 강제 구동용)
            if (!legacyVideo) {
                legacyVideo = document.createElement('video');
                legacyVideo.setAttribute('title', 'AOD Standby');
                legacyVideo.setAttribute('playsinline', '');
                legacyVideo.setAttribute('webkit-playsinline', ''); // iOS 9 이하 standalone/PWA 필수 속성
                legacyVideo.setAttribute('muted', '');
                legacyVideo.muted = true; 
                
                legacyVideo.addEventListener('timeupdate', function() {
                    if (this.currentTime > 0.5) {
                        this.currentTime = 0;
                    }
                }, false);
                
                legacyVideo.addEventListener('ended', function() {
                    this.play();
                }, false);

                // [중요 수정] Standalone(홈 화면에 추가) 모드에서 WebKit 렌더링 엔진은 
                // 오프스크린(화면 밖에 숨겨진 요소) 상태의 비디오 재생을 전력 절약을 위해 강제 일시 정지(Suspend) 시킵니다.
                // 따라서 화면 구석(bottom/right 10px)에 실제 가시 면적을 제공하여 뷰포트 활성 상태를 강제하고,
                // `#000000`(완전 블랙) 배경 위에 투명도 0.05인 블랙 영상을 얹어 눈에는 완벽히 안 보이게 처리합니다.
                legacyVideo.style.position = 'fixed';
                legacyVideo.style.width = '10px';
                legacyVideo.style.height = '10px';
                legacyVideo.style.bottom = '10px';
                legacyVideo.style.right = '10px';
                legacyVideo.style.opacity = '0.05';
                legacyVideo.style.pointerEvents = 'none';
                legacyVideo.style.zIndex = '9999';
                
                var source = document.createElement('source');
                source.src = 'data:video/mp4;base64,AAAAHGZ0eXBNNFYgAAACAGlzb21pc28yYXZjMQAAAAhmcmVlAAAAG21kYXQAAAGzABAHAAABthABGWAAAAABAAA2Z2VzZHMAAAAAAQABAAEAAAA2YXZjMQAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAEAAQABAAEAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAAAAAAc3R0cwAAAAAAAAABAAAAAQABAAABAAAAHHN0c2QAAAAAAAAAAQAAAFhzdHNjAAAAAAAAAAEAAAABAAAAAQAAAAEAAABoc3RzegAAAAAAAAAAAAAAAQAAAAEAAAAUc3RjbwAAAAAAAAABAAAAMAAAAGB1ZHRhAAAAWG1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAAK2lsc3QAAAAjqXRvbwAAABtkYXRhAAAAAQAAAABMYXZmYzgxLjEyLjEwMA==';
                source.type = 'video/mp4';
                legacyVideo.appendChild(source);
                document.body.appendChild(legacyVideo);
            }
            
            var playPromise = legacyVideo.play();
            if (playPromise && typeof playPromise.then === 'function') {
                playPromise.then(function() {
                    // 재생 성공
                }).catch(function(e) {
                    if (window.console) console.log("Legacy AOD Play Error:", e);
                });
            } else {
                legacyVideo.play();
            }

            // 2. [중요 수정] Standalone(홈화면 추가) 샌드박스 보안용 iframe 가상 네비게이션 적용
            // 메인 윈도우의 `window.location.href`를 직접 변경하는 경우, 홈 화면 웹앱(PWA)은 모바일 사파리 브라우저 앱을 
            // 강제로 열거나 화면 프리징이 발생하도록 강제 조치되어 있어 리다이렉트 취소 트릭이 통하지 않고 팅기게 됩니다.
            // 대신 DOM 내부에 숨겨진 dummy iframe을 주입하고, 그 안에서만 15초 주기로 가상 내비게이션(replace)을 돌려
            // 독립된 WebKit 백그라운드 스레드에서 iOS 유휴 보호 시간을 무력화시킵니다.
            if (!legacyIframe) {
                legacyIframe = document.createElement('iframe');
                legacyIframe.style.display = 'none';
                document.body.appendChild(legacyIframe);
            }

            if (!legacyTimer) {
                legacyTimer = window.setInterval(function() {
                    if (!document.hidden && legacyIframe && legacyIframe.contentWindow) {
                        try {
                            // 독립 iframe 내부 갱신을 통해 본체 흐름 및 사파리 아웃팅 현상 없이 시스템 잠금 타이머만 초기화
                            legacyIframe.contentWindow.location.replace('about:blank?t=' + new Date().getTime());
                        } catch(err) {
                            // 예외 격리
                        }
                    }
                }, 15000); 
            }
        }

        function disableLegacyAOD() {
            if (legacyVideo) {
                try {
                    legacyVideo.pause();
                } catch (e) {
                    // 무시
                }
            }
            if (legacyTimer) {
                window.clearInterval(legacyTimer);
                legacyTimer = null;
            }
            if (legacyIframe && legacyIframe.parentNode) {
                try {
                    legacyIframe.parentNode.removeChild(legacyIframe);
                    legacyIframe = null;
                } catch (e) {
                    // 무시
                }
            }
        }

        function setupAOD() {
            var aodToggle = document.getElementById('aodToggle');
            var aodLabel = document.getElementById('aodLabel');

            if (!aodToggle || !aodLabel) {
                return;
            }

            aodToggle.addEventListener('change', function() {
                var self = this;
                if (self.checked) {
                    // 1. 현대적인 브라우저라면 Wake Lock API 시도
                    if (navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
                        try {
                            var requestPromise = navigator.wakeLock.request('screen');
                            if (requestPromise && typeof requestPromise.then === 'function') {
                                requestPromise
                                    .then(function(lock) {
                                        wakeLock = lock;
                                        aodLabel.textContent = "AOD ON";
                                        aodLabel.style.color = "#81c784"; 
                                    })
                                    .catch(function(err) {
                                        // 현대적 API 실패 시 즉시 레거시 기법으로 폴백
                                        enableLegacyAOD();
                                        aodLabel.textContent = "AOD ON";
                                        aodLabel.style.color = "#81c784";
                                    });
                            } else {
                                enableLegacyAOD();
                                aodLabel.textContent = "AOD ON";
                                aodLabel.style.color = "#81c784";
                            }
                        } catch (err) {
                            enableLegacyAOD();
                            aodLabel.textContent = "AOD ON";
                            aodLabel.style.color = "#81c784";
                        }
                    } else {
                        // 2. 구형 아이패드(iOS 9) 및 홈 화면(Standalone) 환경 대응
                        try {
                            enableLegacyAOD();
                            aodLabel.textContent = "AOD ON";
                            aodLabel.style.color = "#81c784";
                        } catch (err) {
                            aodLabel.textContent = "AOD ERROR";
                            aodLabel.style.color = "#e57373";
                            self.checked = false;
                        }
                    }
                } else {
                    // 스위치 해제 시 전체 잠금 해제
                    if (wakeLock !== null) {
                        try {
                            var releasePromise = wakeLock.release();
                            if (releasePromise && typeof releasePromise.then === 'function') {
                                releasePromise
                                    .then(function() { wakeLock = null; })
                                    .catch(function() { wakeLock = null; });
                            } else {
                                wakeLock = null;
                            }
                        } catch (err) {
                            wakeLock = null;
                        }
                    }
                    disableLegacyAOD();
                    aodLabel.textContent = "AOD OFF";
                    aodLabel.style.color = "#888";
                }
            });

            // 화면 가시성이 돌아왔을 때 재생 복원
            document.addEventListener('visibilitychange', function() {
                if (aodToggle.checked) {
                    if (wakeLock !== null && document.visibilityState === 'visible') {
                        if (navigator.wakeLock && typeof navigator.wakeLock.request === 'function') {
                            try {
                                var resumePromise = navigator.wakeLock.request('screen');
                                if (resumePromise && typeof resumePromise.then === 'function') {
                                    resumePromise
                                        .then(function(lock) {
                                            wakeLock = lock;
                                        })
                                        .catch(function() {
                                            enableLegacyAOD();
                                        });
                                }
                            } catch (err) {
                                enableLegacyAOD();
                            }
                        }
                    } else if (document.visibilityState === 'visible') {
                        enableLegacyAOD();
                    }
                }
            });

            // [추가] Standalone 모드에서는 visibilitychange 감지 버그(permanent document.hidden=false)가 빈번하여, 
            // 윈도우 포커스 복원 및 페이지쇼 이벤트를 통해 확실하게 연동되도록 보강합니다.
            window.addEventListener('focus', function() {
                if (aodToggle.checked) {
                    enableLegacyAOD();
                }
            }, false);

            window.addEventListener('pageshow', function() {
                if (aodToggle.checked) {
                    enableLegacyAOD();
                }
            }, false);
        }

        // --- 초기화 안정 실행 로직 ---
        function safeRun() {
            try {
                init();
            } catch (e) {
                if (window.console) console.error("Initialize system failed:", e);
            }
            
            try {
                setupAOD();
            } catch (e) {
                if (window.console) console.error("AOD system failed:", e);
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", safeRun);
        } else {
            safeRun();
        }
    </script>
</body>
</html>
