<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimal StandBy Dashboard</title>
    
    <!-- 📱 Apple 전용 웹앱(PWA) 설정 태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StandBy">
    
    <!-- 🎨 홈 화면에 표시될 앱 아이콘 -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3593/3593455.png">

    <style>
        /* 미니멀 다크 테마 및 기본 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #0b0b0c; color: #e3e3e6; font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; height: 100vh; display: flex; }
        
        /* 50:50 좌우 분할 */
        .panel { width: 50%; height: 100vh; padding: 60px 50px; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .left-panel { border-right: 1px solid #222; background-color: #0b0b0c; align-items: flex-start; }
        .right-panel { background-color: #050505; align-items: center; }
        
        /* 실시간 날짜 표시 (좌측 상단 고정) */
        .date-display { position: absolute; top: 40px; left: 50px; font-size: 1.1rem; color: #666; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        /* 문구 및 저자 폰트 스타일 */
        .quote-text { font-size: 2.4rem; line-height: 1.6; margin-bottom: 25px; font-family: 'Georgia', serif; font-weight: 300; text-align: left; }
        .right-panel .quote-text { text-align: center; } 
        
        /* 강조 표시 (볼드체 스타일) */
        strong { font-weight: 700; color: #ffffff; }
        
        /* 저자 및 작품명 영역 */
        .quote-author { font-size: 1.2rem; color: #888; font-family: 'Georgia', serif; }
        .quote-author em { font-style: italic; color: #aaa; } 
        .right-panel .quote-author { text-align: center; width: 100%; }

        /* 실시간 날씨 표시 영역 */
        .weather-info { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; font-size: 3.5rem; font-weight: 200; }
        .weather-info span.temp { font-size: 2.5rem; color: #aaa; }
        
        /* 📐 [레이아웃 수정] 기온 숫자 아랫단과 완벽하게 수평 정렬 일치시킴 */
        .weather-info span.city { font-size: 1.1rem; color: #555; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; align-self: baseline; }

        /* 내장형 화면 보호기 오버레이 (터치 없을 시 암전) */
        .screensaver { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 1000; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 좌측: 실시간 문학 날씨 -->
    <div class="panel left-panel" id="weatherPanel">
        <div class="date-display" id="currentDate">-- --- ----</div>
        <div class="weather-info">
            <span id="weatherIcon">--</span>
            <span class="temp" id="weatherTemp">--°C</span>
            <span class="city" id="cityLabel">Detecting...</span>
        </div>
        <div class="quote-text" id="weatherQuote">Loading real-time weather...</div>
        <div class="quote-author" id="weatherAuthor"></div>
    </div>

    <!-- 우측: 실시간 문학 시계 -->
    <div class="panel right-panel" id="clockPanel">
        <div class="quote-text" id="clockQuote">Syncing time with literature...</div>
        <div class="quote-author" id="clockAuthor"></div>
    </div>

    <!-- 화면 보호기 오버레이 -->
    <div class="screensaver" id="screensaverOverlay" onclick="wakeUp()"></div>

    <script>
        let idleTimer;
        let lastTimeStr = ""; 
        const idleLimit = 5 * 60 * 1000; // 5분 후 화면 보호기 작동

        const weatherDatabase = {
            "Clear": { q: "The sky was <strong>perfectly clear</strong> and the sun shone bright, casting long shadows across the empty street.", a: "<em>Pride and Prejudice</em>, Jane Austen", icon: "☀️" },
            "Clouds": { q: "The <strong>gray clouds</strong> gathered heavily above, swallowing the remaining light of the afternoon.", a: "<em>Wuthering Heights</em>, Emily Brontë", icon: "☁️" },
            "Rain": { q: "The <strong>heavy rain</strong> pattered against the window panes, a steady rhythm that drowned out all other thoughts.", a: "<em>Jane Eyre</em>, Charlotte Brontë", icon: "🌧️" },
            "Snow": { q: "The ground was quickly covered in a <strong>thin layer of snow</strong>, quieting the entire city into a white slumber.", a: "<em>I, Robot</em>, Isaac Asimov", icon: "❄️" },
            "Thunderstorm": { q: "A sudden crack of <strong>thunder</strong> shook the floorboards, followed by a brilliant flash of lightning.", a: "<em>Frankenstein</em>, Mary Shelley", icon: "⛈️" }
        };

        async function init() {
            resetIdleTimer();
            setupEventListeners();
            
            updateDate();
            await fetchWeather();
            checkTimeEngine();

            setInterval(checkTimeEngine, 1000);
            setInterval(fetchWeather, 30 * 60000);
        }

        function updateDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            
            document.getElementById('currentDate').innerText = `${day} ${month} ${year}`;
        }

        async function fetchWeather() {
            let lat = 37.5665;
            let lon = 126.9780;
            let cityName = "Seoul";

            try {
                const locResponse = await fetch("https://ipapi.co/json/");
                if (locResponse.ok) {
                    const locData = await locResponse.json();
                    lat = locData.latitude || lat;
                    lon = locData.longitude || lon;
                    cityName = locData.city || cityName;
                }
            } catch (e) {
                console.log("Location auto-detection failed.");
            }

            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                if (!response.ok) throw new Error("Offline");
                const data = await response.json();
                const temp = Math.round(data.current_weather.temperature);
                const code = data.current_weather.weathercode;
                
                let weatherCondition = "Clear";
                if (code >= 1 && code <= 3) weatherCondition = "Clouds";
                else if (code >= 51 && code <= 67) weatherCondition = "Rain";
                else if (code >= 71 && code <= 82) weatherCondition = "Snow";
                else if (code >= 95) weatherCondition = "Thunderstorm";

                const match = weatherDatabase[weatherCondition];

                document.getElementById('weatherIcon').innerText = match.icon;
                document.getElementById('weatherTemp').innerText = `${temp}°C`;
                document.getElementById('cityLabel').innerText = cityName;
                document.getElementById('weatherQuote').innerHTML = match.q;
                document.getElementById('weatherAuthor').innerHTML = `- ${match.a}`;
            } catch (error) {
                document.getElementById('weatherIcon').innerText = "🌐";
                document.getElementById('weatherTemp').innerText = "Offline";
                document.getElementById('cityLabel').innerText = "Disconnected";
                document.getElementById('weatherQuote').innerHTML = "The connection to the world was severed; the sky remained an <strong>unreadable page</strong>, waiting for the network to restore its voice.";
                document.getElementById('weatherAuthor').innerHTML = "- The Offline Chronicler";
            }
        }

        function checkTimeEngine() {
            const now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${hours}:${minutes}`;

            if (currentTimeStr !== lastTimeStr) {
                lastTimeStr = currentTimeStr;
                updateClock(hours, minutes);
                updateDate();
            }
        }

        async function updateClock(hours, minutes) {
            const fileTimeStr = `${hours}_${minutes}`;

            try {
                const response = await fetch(`https://raw.githubusercontent.com/JohannesNE/literature-clock/master/docs/times/${fileTimeStr}.json`);
                if (!response.ok) throw new Error("Fetch failed");
                
                const quotesArray = await response.json();
                
                if (quotesArray && quotesArray.length > 0) {
                    const selected = quotesArray[Math.floor(Math.random() * quotesArray.length)];
                    
                    let first = selected.quote_first || "";
                    let timeCase = selected.quote_time_case || "";
                    let last = selected.quote_last || "";
                    
                    // 📏 [업데이트] 기존 75자 제한에서 130자로 대폭 확장 (화면에 1~2줄 더 넉넉히 출력)
                    const maxSideLength = 130;
                    
                    if (first.length > maxSideLength) {
                        let breakPoint = first.indexOf(' ', first.length - maxSideLength);
                        if (breakPoint === -1) breakPoint = first.length - maxSideLength;
                        // 💬 [업데이트] 괄호를 제거하고 정갈한 클래식 스타일의 . . . 로 교체
                        first = ". . . " + first.slice(breakPoint).trim();
                    }
                    
                    if (last.length > maxSideLength) {
                        let breakPoint = last.lastIndexOf(' ', maxSideLength);
                        if (breakPoint === -1) breakPoint = maxSideLength;
                        last = last.slice(0, breakPoint).trim() + " . . .";
                    }
                    
                    let displayQuote = `${first} <strong>${timeCase}</strong> ${last}`;
                    displayQuote = displayQuote.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    displayQuote = displayQuote.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
                    displayQuote = displayQuote.replace(/<em>(.*?)<\/em>/gi, '<strong>$1</strong>');
                    
                    let displayAuthor = `- <em>${selected.title}</em>, ${selected.author}`;
                    
                    document.getElementById('clockQuote').innerHTML = displayQuote;
                    document.getElementById('clockAuthor').innerHTML = displayAuthor;
                } else {
                    showFallbackTime(`${hours}:${minutes}`);
                }
            } catch (error) {
                showFallbackTime(`${hours}:${minutes}`);
            }
        }

        function showFallbackTime(timeStr) {
            // 💬 [업데이트] 기본 예외 화면도 괄호 없는 . . . 스타일로 보정
            document.getElementById('clockQuote').innerHTML = `The clock hands quietly moved to <strong>${timeStr}</strong> . . . waiting for the next story.`;
            document.getElementById('clockAuthor').innerHTML = "- Unknown Timekeeper";
        }

        function setupEventListeners() {
            document.body.addEventListener('touchstart', resetIdleTimer);
            document.body.addEventListener('mousemove', resetIdleTimer);
            document.body.addEventListener('click', resetIdleTimer);
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (document.getElementById('screensaverOverlay').style.display !== 'block') {
                idleTimer = setTimeout(() => {
                    document.getElementById('screensaverOverlay').style.display = 'block';
                }, idleLimit);
            }
        }

        function wakeUp() {
            document.getElementById('screensaverOverlay').style.display = 'none';
            resetIdleTimer();
            const now = new Date();
            updateClock(String(now.getHours()).padStart(2, '0'), String(now.getMinutes()).padStart(2, '0'));
        }

        window.onload = init;
    </script>
</body>
</html>
